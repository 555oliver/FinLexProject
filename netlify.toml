[build]
  command = "npm run build:netlify"
  publish = "dist/finlex/browser"
  functions = "backend/dist/netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["bcrypt"]
  ignored_node_modules = ["@nestjs/microservices", "@nestjs/websockets"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
