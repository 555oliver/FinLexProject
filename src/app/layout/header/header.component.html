<header class="header" id="header">
<div class="header-inner">
<div class="logo" routerLink="/inicio">
<div class="logo-icon">F</div>
<div class="logo-text">
<div class="logo-name">FinLex</div>
<div class="logo-tagline">Group</div>
</div>
</div>
<nav class="nav-desktop">
<a class="nav-link" routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
<a class="nav-link" routerLink="/services" routerLinkActive="active">Servicios</a>
<a class="nav-link" routerLink="/products" routerLinkActive="active">Productos</a>
<a class="nav-link" routerLink="/about" routerLinkActive="active">Nosotros</a>
<a class="nav-link" routerLink="/testimonials" routerLinkActive="active">Testimonios</a>
<a class="nav-link" routerLink="/contact" routerLinkActive="active">Contacto</a>
<a class="nav-link" routerLink="/legal" routerLinkActive="active">Legal</a>
</nav>
<div class="header-actions">
<button class="btn-gold" style="padding:10px 20px;" routerLink="/portal">Portal Cliente</button>
<button class="btn-gold btn-gold-solid" style="padding:10px 20px;" routerLink="/contact">Evaluación Privada</button>
</div>
<button class="mobile-menu-btn" (click)="toggleMenu()">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
</button>
</div>
</header>
<!-- Mobile Menu -->
<div class="mobile-nav" id="mobileNav" [class.active]="menuOpen">
<button class="close-btn" (click)="toggleMenu()">&times;</button>
<a (click)="closeMenu()" routerLink="/inicio">Inicio</a>
<a (click)="closeMenu()" routerLink="/services">Servicios</a>
<a (click)="closeMenu()" routerLink="/products">Productos</a>
<a (click)="closeMenu()" routerLink="/about">Nosotros</a>
<a (click)="closeMenu()" routerLink="/testimonials">Testimonios</a>
<a (click)="closeMenu()" routerLink="/contact">Contacto</a>
<a (click)="closeMenu()" routerLink="/legal">Legal</a>
<a (click)="closeMenu()" routerLink="/portal">Portal Cliente</a>
</div>
